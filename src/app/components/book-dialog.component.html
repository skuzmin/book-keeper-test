<section class="book-dialog">
  <h3 class="book-dialog-title">Add book</h3>
  <form class="book-dialog-form">
    <div class="form-group">
      <label class="form-label" for="title">Title:</label>
      <input class="book-input" id="title" type="text" [(ngModel)]="book.title" name="title"/>
    </div>
    <div class="form-group">
      <label class="form-label" for="author">Author:</label>
      <input class="book-input" id="author" type="text" [(ngModel)]="book.author" name="author"/>
    </div>
    <div class="form-group">
      <label class="form-label" for="pages">Pages:</label>
      <input class="book-input" id="pages" type="number" [(ngModel)]="book.pages" name="pages"/>
    </div>
  </form>
  @if(isError) {
  <div class="book-dialog-error-msg">All field are required!</div>
  }
  <div class="book-dialog-btn-group">
    <button class="book-btn danger-btn" mat-dialog-close>Cancel</button>
    <button class="book-btn" (click)="addBook()">Add</button>
  </div>
</section>
