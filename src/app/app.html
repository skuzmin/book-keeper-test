<main class="main-container">
  @if (!books().length) {
  <div class="no-books-msg">
    <div>You don't have any books yet.</div>
    <div class="no-books-msg-btn-group">
      <span>Please </span>
      <button class="book-btn" (click)="addBook()">+ Add book</button>
      <span> or </span>
      <button class="book-btn" (click)="importInput.click()">+ Import books</button>
      <input hidden #importInput type="file" accept=".xml,application/xml,text/xml"
        (change)="onImportInputChange($event)" />
    </div>
  </div>
  }
  @else {
  <div>
    <div>Title | Author | Pages</div>
    @for (book of books(); track $index) {
    <div>{{book.title}} | {{book.author}} | {{book.pages}}</div>
    }
  </div>
  }
</main>
